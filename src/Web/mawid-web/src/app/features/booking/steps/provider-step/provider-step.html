<section class="bg-white border border-slate-200 rounded-2xl p-6 mt-6">
    <h2 class="text-lg font-semibold mb-4">Choose a provider</h2>
    @if (isLoading()) {
    <p class="text-slate-500">Loading...</p>
    } @else {
    <div class="grid gap-3 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
        @for (p of providers(); track p.id) {
        <button type="button" (click)="selected.set(p.id)" [class]="selected() === p.id
                    ? 'border-2 border-primary bg-primary-soft'
                    : 'border border-slate-200 bg-white hover:border-slate-400'"
            class="flex items-center gap-3 p-4 rounded-xl text-left cursor-pointer transition">
            <span class="size-11 shrink-0 rounded-full bg-primary text-white grid place-items-center font-semibold">
                {{ initials(p.name) }}
            </span>
            <span class="flex flex-col">
                <span class="font-semibold text-slate-900">{{ p.name }}</span>
                <span class="text-sm text-slate-600">{{ p.title }}</span>
            </span>
        </button>
        } @empty {
        <p class="text-slate-500">No one offers this service right now</p>
        }
    </div>
    }
</section>
