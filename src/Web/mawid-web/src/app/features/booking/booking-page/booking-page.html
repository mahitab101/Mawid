<main class="min-h-screen bg-slate-50">
    <div class="max-w-5xl mx-auto px-6 py-8">

        @if (bookedAppointment(); as appt) {

        <app-booking-confirmation [serviceTitle]="selectedService()?.title ?? ''"
            [providerName]="selectedProvider()?.name ?? ''"
            [when]="formatDate(appt.startTime) + ' · ' + formatTime(appt.startTime)" [cancelled]="bookingCancelled()"
            [isCancelling]="isCancelling()" (cancel)="cancelBooking()" (bookAnother)="bookAnother()" />

        } @else {

        <h1 class="text-2xl font-bold text-slate-900 mb-6">Book an appointment</h1>

        <app-service-step [services]="services.value()?.data ?? []" [isLoading]="services.isLoading()"
            [hasError]="!!services.error()" [(selected)]="selectedServiceId" />

        <!-- provider -->
        @if (selectedServiceId()) {
        <app-provider-step [providers]="providers.value()?.data ?? []" [isLoading]="providers.isLoading()"
            [(selected)]="selectedProviderId" />
        }


        <!--  Days -->
        @if (selectedProviderId()) {
        <app-date-step [days]="days()" [(selected)]="selectedDate" />
        }

        <!--  Time -->
        @if (selectedDate()) {
        <app-time-step [slots]="availability.value()?.data ?? []" [isLoading]="availability.isLoading()"
            [error]="bookingError()" [timeZone]="businessStore.timeZone()" [(selected)]="selectedSlot"
            (selectedChange)="bookingError.set(null)" />
        }


        <!-- Form  -->
        @if (selectedSlot()) {
        <app-details-step [isSubmitting]="isSubmitting()" (submitted)="book($event)" />
        }

        }
    </div>
</main>
